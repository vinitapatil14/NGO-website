<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<!-- Creative CSS -->
<style>
  .contact-section {
    background: linear-gradient(135deg, #e9f7f6 0%, #f6f8fd 100%);
    padding: 80px 0;
  }

  .contact-section h2 {
    font-weight: 700;
    color: #2c3e50;
  }

  .contact-form {
    background-color: #fff;
    border-radius: 15px;
    transition: all 0.3s ease-in-out;
  }

  .contact-form:hover {
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
  }

  .form-control:focus {
    border-color: #007bff;
    box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
  }

  .btn-primary {
    background-color: #007bff;
    border-color: #007bff;
    border-radius: 30px;
    font-size: 1rem;
    font-weight: 500;
    transition: 0.3s ease-in-out;
  }

  .btn-primary:hover {
    background-color: #0056b3;
    border-color: #0056b3;
    transform: translateY(-2px);
  }

  @media (max-width: 768px) {
    .contact-section {
      padding: 50px 20px;
    }
  }
   .navbar {
      background-color: #630553;
    }
  .footer{
      background-color: #630553;
      height: 50px;
      text-align: center;
      padding-top: 10px;
  }
  .form-footer
    
      {
      background-color: #2c3e50;
    }
    

</style>
<body>
   <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="#"><h2>Udaan Foundation</h2></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></about></li>
          <li class="nav-item"><a class="nav-link" href="volunteer.html">Volunteer</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>


  <!-- Contact Us Section -->
<section id="contact" class="contact-section">
  <div class="container">
    <h2 class="text-center mb-4">📬 Get in Touch</h2>
    <p class="text-center mb-5">We’d love to hear from you! Whether you have a question, want to volunteer, or just say hello — drop us a message.</p>

    <div class="row justify-content-center">
      <div class="col-lg-8">
        <form class="contact-form shadow p-5 rounded bg-white">
          <div class="mb-4">
            <label for="name" class="form-label">Your Name</label>
            <input type="text" class="form-control form-control-lg" id="name" placeholder="John Doe" required>
          </div>
          <div class="mb-4">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control form-control-lg" id="email" placeholder="john@example.com" required>
          </div>
          <div class="mb-4">
            <label for="subject" class="form-label">Subject</label>
            <input type="text" class="form-control form-control-lg" id="subject" placeholder="Reason for contacting">
          </div>
          <div class="mb-4">
            <label for="message" class="form-label">Your Message</label>
            <textarea class="form-control form-control-lg" id="message" rows="5" placeholder="Write your message here..." required></textarea>
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-primary px-5 py-2 shadow-sm">Send Message</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>


  <footer id ="form-footer"   class="bg-success text-white text-center ">
   
    <div class="footer"> <h4>2025 Udaan Foundation NGO</h4></div>
  </footer>
</body>
</html>
